<div id='vboxChooserDiv'></div>
<script type='text/javascript'>


/*
 * 
 *
 * Startup for VM List
 *
 */

vboxChooser.setAnchorId('vboxChooserDiv');

// Stop actions
var sChildren = [];
for(var i = 0; i < vboxVMActions.stop_actions.length; i++) {
	sChildren[sChildren.length] = $.extend(true,{},vboxVMActions[vboxVMActions.stop_actions[i]],{'iconStringDisabled':'_disabled'});
}

// VM List Group context menu
var groupContextMenu = [];
if(vboxHasPermission('create_vm')) {
	groupContextMenu.push(vboxVMGroupActions['newmachine']);
	groupContextMenu.push(vboxVMGroupActions['addmachine']);
}
groupContextMenu.push($.extend({}, vboxVMGroupActions['rename'], {separator: true}));
groupContextMenu.push(vboxVMGroupActions['ungroup']);
groupContextMenu.push($.extend({}, vboxVMActions['start'], {'separator' : true}));
groupContextMenu.push(vboxVMActions['pause']);
groupContextMenu.push(vboxVMActions['reset']);
groupContextMenu.push($.extend({},vboxVMActions['stop'], {'children':sChildren}));
groupContextMenu.push($.extend({},vboxVMActions['discard'], {separator: true}));
groupContextMenu.push(vboxVMActions['refresh']);
groupContextMenu.push($.extend({}, vboxVMGroupActions['sort'], {separator:true}));
vboxChooser.setContextMenu('group', groupContextMenu);


/*
 * VM Context menu setup (menu per VM in list)
 */
 
vboxChooser.setContextMenu('vm',[
   	vboxVMActions['settings'],
   	vboxVMActions['clone'],
   	vboxVMActions['remove'],
   	vboxVMActions['group'],
   	$.extend({},vboxVMActions['start'], {'separator' : true}),
    vboxVMActions['pause'],
    vboxVMActions['reset'],
   	$.extend({},vboxVMActions['stop'], {'children': sChildren}),
   	$.extend({},vboxVMActions['discard'], {'separator' : true}),
   	vboxVMActions['logs'],
   	vboxVMActions['refresh']
]);

// Don't need thse anymore
sChildren = null;

/*
 * VM list context menu setup
 */
var anchorContextMenu = [];
if(vboxHasPermission('create_vm')) {
	anchorContextMenu.push(vboxVMActions['new']);
	anchorContextMenu.push(vboxVMActions['add']);
	anchorContextMenu.push({
		'name':'fileImport',
		'label':'Import Appliance...',
		'icon':'import',
		'click':function(){
			new vboxWizardImportApplianceDialog().run();
		},
		'separator': true
	});
	anchorContextMenu.push({
		'name':'fileExport',
		'label':'Export Appliance...',
		'icon':'export',
		'click':function(){new vboxWizardExportApplianceDialog().run(); }
	});
}
anchorContextMenu.push($.extend({},vboxVMGroupActions['sort'],{'separator':true,click:function(){
	vboxChooser.sortSelectedGroup(true);
}}));
vboxChooser.setContextMenu('anchor', anchorContextMenu);


vboxChooser.start();

</script>
